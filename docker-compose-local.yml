version: '3.8'

# ============================================================
# Steam 게임 분석 프로젝트 - 로컬 개발 환경
# ============================================================
# 구성: Airflow + PostgreSQL(메타DB & 분석DB) + MinIO(S3 대체)
# 실행: docker-compose up -d
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: steam-airflow:latest   # pyspark 실행에 필요한 JDK 포함 커스텀 이미지
  environment: &airflow-common-env
    # 추가 패키지 설치 (컨테이너 기동 시 자동 pip install)
    _PIP_ADDITIONAL_REQUIREMENTS: "polars pyarrow kiwipiepy apache-airflow-providers-docker pyspark kafka-python pytest"

    # Airflow 기본 설정
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: 'ZmRkNjQ2OTBkZjBkNGI2NDg0MjU0NjY2ZjU2NzYwZGY='

    # Airflow 메타DB (PostgreSQL)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow

    # MinIO 연결 (S3 대체)
    # Airflow의 Amazon Provider에서 이 Connection을 사용
    AIRFLOW__CONN__MINIO_S3: >-
      aws://minioadmin:minioadmin@?endpoint_url=http://minio:9000

    # 분석용 PostgreSQL 연결 (나중에 Snowflake로 교체)
    AIRFLOW__CONN__ANALYTICS_DB: postgresql+psycopg2://analytics:analytics@analytics-postgres:5432/steam_analytics

    # Steam API Key (실행 시 .env 파일에서 로드)
    STEAM_API_KEY: ${STEAM_API_KEY}

    # Slack Webhook URL (실행 시 .env 파일에서 로드)
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    
    # Spark 마스터 노드
    # 주의: Airflow 커넥션 환경변수는 AIRFLOW_CONN_<ID> (싱글 언더스코어) 형식이어야 인식됨
    AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077

    # Kafka 브로커
    AIRFLOW_CONN_KAFKA_DEFAULT: kafka://kafka:9092

  volumes:
    - ./dags:/opt/airflow/dags           # DAG 파일들
    - ./plugins:/opt/airflow/plugins     # 커스텀 플러그인
    - ./scripts:/opt/airflow/scripts     # 유틸리티 스크립트
    - ./logs:/opt/airflow/logs           # 로그
    - ./tests:/opt/airflow/tests         # 테스트
    - spark_checkpoints:/opt/spark/checkpoints   # Structured Streaming checkpoint (driver 쪽, worker와 동일 경로)
  depends_on:
    airflow-postgres:
      condition: service_healthy
    analytics-postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # ============================================================
  # 1. Airflow 메타 데이터베이스
  # ============================================================
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  # ============================================================
  # 2. 분석용 데이터베이스 (로컬에서 Snowflake 대체)
  # ============================================================
  analytics-postgres:
    image: postgres:15-alpine
    container_name: analytics-postgres
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: steam_analytics
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    volumes:
      - analytics_pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d  # 초기 테이블 생성
      - ./init-db-replication/00-setup-replication.sh:/docker-entrypoint-initdb.d/00-setup-replication.sh
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "analytics", "-d", "steam_analytics"]
      interval: 10s
      retries: 5
      start_period: 5s
  # ============================================================
  # 2-1. 분석용 DB 복제본 (읽기 전용 standby)
  # ============================================================
  analytics-postgres-replica:
    image: postgres:15-alpine
    container_name: analytics-postgres-replica
    environment:
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - analytics_pg_replica_data:/var/lib/postgresql/data
      - ./init-db-replication/replica-entrypoint.sh:/replica-entrypoint.sh
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    depends_on:
      analytics-postgres:
        condition: service_healthy
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "analytics"]
      interval: 10s
      retries: 5
      start_period: 20s
  # ============================================================
  # 3. MinIO (로컬 S3 대체)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO 웹 콘솔
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5
      start_period: 5s

  # MinIO 초기 버킷 생성
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/steam-raw --ignore-existing;
      mc mb local/steam-silver --ignore-existing;
      mc mb local/steam-processed --ignore-existing;
      echo 'MinIO 버킷 생성 완료: steam-raw, steam-silver, steam-processed';
      "

  # ============================================================
  # 3-1. Kafka (KRaft 모드 — Zookeeper 없이 단일 브로커)
  # ============================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9094:9094"   # 호스트에서 직접 접속용
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      retries: 5
      start_period: 15s

  # ============================================================
  # 3-2. Spark (standalone 클러스터 — master 1 + worker 2)
  # ============================================================
  spark-master:
    image: apache/spark:latest
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports:
      - "7077:7077"   # spark-submit이 접속하는 master 포트
      - "8081:8080"   # Spark Master Web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080"]
      interval: 10s
      retries: 5
      start_period: 15s

  spark-worker-1:
    image: apache/spark:latest
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints   # Structured Streaming checkpoint (driver+executor 공유)
    ports:
      - "8082:8081"   # Worker 1 Web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081"]
      interval: 10s
      retries: 5
      start_period: 15s

  spark-worker-2:
    image: apache/spark:latest
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints   # Structured Streaming checkpoint (driver+executor 공유)
    ports:
      - "8083:8081"   # Worker 2 Web UI
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081"]
      interval: 10s
      retries: 5
      start_period: 15s

  # ============================================================
  # 4. Airflow 초기화 (최초 1회만 실행)
  # ============================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
        echo "Airflow 초기화 완료!"
    restart: "no"

  # ============================================================
  # 5. Airflow Webserver
  # ============================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"   # Airflow UI
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # 6. Airflow Scheduler
  # ============================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
      - ./tests:/opt/airflow/tests                  # 테스트 (integration test 실행용)
      - /var/run/docker.sock:/var/run/docker.sock   # DockerOperator용 docker socket
      - spark_checkpoints:/opt/spark/checkpoints    # Structured Streaming checkpoint (driver 쪽, worker와 동일 경로)
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # 7. dbt (DockerOperator가 이 이미지로 컨테이너를 생성하여 실행)
  # ============================================================
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    image: steam-dbt:latest       # DockerOperator에서 참조할 이미지명
    profiles: ["dbt"]             # docker-compose up 시 자동 시작 안 함 (빌드 전용)
    depends_on:
      analytics-postgres:
        condition: service_healthy

volumes:
  airflow_pg_data:
  analytics_pg_data:
  analytics_pg_replica_data:
  minio_data:
  kafka_data:
  spark_checkpoints:
