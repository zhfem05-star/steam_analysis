# ============================================================
# Steam 게임 분석 프로젝트 - 로컬 개발 환경
# ============================================================
# 구성: Airflow + PostgreSQL(메타DB & 분석DB) + SeaweedFS(S3 호환 저장소) + Kafka
# 실행: docker compose -f docker-compose-local.yml up -d
# 서버: docker compose -f docker-compose-local.yml -f docker-compose-server.yml up -d
# ============================================================
# 비밀 값(Fernet 키·DB·관리자 계정)은 .env에서만 읽음. 값이 없으면 기동 거부
# 포트는 127.0.0.1에만 바인딩해 같은 PC·서버 밖에서 접근하지 못하게 함
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: steam-airflow:latest
  environment: &airflow-common-env
    # Python 패키지는 airflow/Dockerfile에서 버전 고정 설치 (기동마다 pip install 하지 않음)

    # Airflow 기본 설정
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?.env에 AIRFLOW_FERNET_KEY 필요}
    # 동시 실행 상한: 동시 task는 최대 2개 수준이라 메모리 급증 방지용으로 낮춤 (기본 32·16)
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'

    # Airflow 메타DB (PostgreSQL)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?.env에 AIRFLOW_DB_USER 필요}:${AIRFLOW_DB_PASSWORD:?.env에 AIRFLOW_DB_PASSWORD 필요}@airflow-postgres:5432/${AIRFLOW_DB_NAME:?.env에 AIRFLOW_DB_NAME 필요}

    # 주의: Airflow 커넥션 환경변수는 AIRFLOW_CONN_<ID> (싱글 언더스코어) 형식이어야 인식됨

    # S3 호환 저장소 연결 (로컬 SeaweedFS, 운영 시 AWS S3로 교체)
    # Airflow의 Amazon Provider에서 이 Connection을 사용
    AIRFLOW_CONN_S3_STORAGE: >-
      aws://${S3_ACCESS_KEY:-steamadmin}:${S3_SECRET_KEY:-steamadmin-secret}@/?endpoint_url=http%3A%2F%2Fseaweedfs%3A8333&region_name=us-east-1

    # 분석용 PostgreSQL 연결 (나중에 Snowflake로 교체)
    AIRFLOW_CONN_ANALYTICS_DB: postgres://${ANALYTICS_DB_USER:?.env에 ANALYTICS_DB_USER 필요}:${ANALYTICS_DB_PASSWORD:?.env에 ANALYTICS_DB_PASSWORD 필요}@${ANALYTICS_DB_HOST:-analytics-postgres}:5432/${ANALYTICS_DB_NAME:?.env에 ANALYTICS_DB_NAME 필요}

    # Steam API Key (실행 시 .env 파일에서 로드)
    STEAM_API_KEY: ${STEAM_API_KEY}
    # Hook은 Variable.get("steam_api_key")로 읽으므로 같은 값을 Airflow Variable로 자동 등록
    AIRFLOW_VAR_STEAM_API_KEY: ${STEAM_API_KEY}

    # Slack Webhook URL (실행 시 .env 파일에서 로드)
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

    # Kafka 브로커
    AIRFLOW_CONN_KAFKA_DEFAULT: kafka://kafka:9092

    # Snowflake 커넥션
    AIRFLOW_CONN_SNOWFLAKE_DEFAULT: >-
      snowflake://${SNOWFLAKE_USER}:${SNOWFLAKE_PASSWORD}@${SNOWFLAKE_ACCOUNT}/${SNOWFLAKE_DATABASE}/${SNOWFLAKE_SCHEMA}?warehouse=${SNOWFLAKE_WAREHOUSE}&role=${SNOWFLAKE_ROLE}

  volumes:
    - ./dags:/opt/airflow/dags           # DAG 파일들
    - ./plugins:/opt/airflow/plugins     # 커스텀 플러그인
    - ./scripts:/opt/airflow/scripts     # 유틸리티 스크립트
    - ./logs:/opt/airflow/logs           # 로그
    - ./tests:/opt/airflow/tests         # 테스트
  depends_on:
    airflow-postgres:
      condition: service_healthy
    analytics-postgres:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy

services:
  # ============================================================
  # 1. Airflow 메타 데이터베이스
  # ============================================================
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?.env에 AIRFLOW_DB_USER 필요}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?.env에 AIRFLOW_DB_PASSWORD 필요}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:?.env에 AIRFLOW_DB_NAME 필요}
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 5s

  # ============================================================
  # 2. 분석용 데이터베이스 (로컬에서 Snowflake 대체)
  # ============================================================
  analytics-postgres:
    image: postgres:15-alpine
    container_name: analytics-postgres
    environment:
      POSTGRES_USER: ${ANALYTICS_DB_USER:?.env에 ANALYTICS_DB_USER 필요}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?.env에 ANALYTICS_DB_PASSWORD 필요}
      POSTGRES_DB: ${ANALYTICS_DB_NAME:?.env에 ANALYTICS_DB_NAME 필요}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    volumes:
      - analytics_pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d  # 초기 테이블 생성
      - ./init-db-replication/00-setup-replication.sh:/docker-entrypoint-initdb.d/00-setup-replication.sh
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 5s
  # ============================================================
  # 2-1. 분석용 DB 복제본 (읽기 전용 standby)
  # ============================================================
  analytics-postgres-replica:
    image: postgres:15-alpine
    container_name: analytics-postgres-replica
    environment:
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - analytics_pg_replica_data:/var/lib/postgresql/data
      - ./init-db-replication/replica-entrypoint.sh:/replica-entrypoint.sh
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    depends_on:
      analytics-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${ANALYTICS_DB_USER:?.env에 ANALYTICS_DB_USER 필요}"]
      interval: 10s
      retries: 5
      start_period: 20s
  # ============================================================
  # 3. SeaweedFS (로컬 S3 호환 저장소)
  # ============================================================
  # MinIO 공식 이미지 배포 중단으로 대체. master·volume·filer·S3 gateway를 단일 컨테이너로 실행
  # 관리자 키는 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY 환경변수로 생성 (Airflow 연결과 같은 값)
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs
    command: server -s3 -s3.port=8333 -ip=seaweedfs -ip.bind=0.0.0.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-steamadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-steamadmin-secret}
    volumes:
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:9333:9333"   # Master UI
      - "127.0.0.1:8888:8888"   # Filer UI (버킷·파일 탐색)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8333/healthz"]
      interval: 10s
      retries: 5
      start_period: 15s

  # 초기 버킷 생성 (이미 있으면 건너뜀)
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.52
    container_name: seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      existing=$$(echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888);
      for bucket in steam-raw steam-silver steam-processed; do
        if echo \"$$existing\" | grep -qw \"$$bucket\"; then
          echo \"버킷 존재: $$bucket\";
        else
          echo \"s3.bucket.create -name $$bucket\" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888;
        fi;
      done;
      echo 'SeaweedFS 버킷 준비 완료: steam-raw, steam-silver, steam-processed';
      "
    restart: "no"

  # ============================================================
  # 3-1. Kafka (KRaft 모드 — Zookeeper 없이 단일 브로커)
  # ============================================================
  kafka:
    image: apache/kafka:4.3.1   # latest 대신 고정: 재배포 시 예고 없는 버전 변경 방지
    container_name: kafka
    environment:
      # 이미지 기본값은 -Xmx1G -Xms1G (기동 즉시 1GB). 256MB로 충분 (2026-11-26 실측 컨테이너 약 500MB)
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      # 이미지 기본값 /tmp/kafka-logs는 볼륨 밖이라 컨테이너 재생성 시 토픽·consumer offset 유실
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"   # 호스트에서 직접 접속용
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      retries: 5
      start_period: 15s

  # ============================================================
  # 4. Airflow 초기화 (최초 1회만 실행)
  # ============================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:?.env에 AIRFLOW_ADMIN_USER 필요}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?.env에 AIRFLOW_ADMIN_PASSWORD 필요}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
        echo "Airflow 초기화 완료!"
    restart: "no"

  # ============================================================
  # 5. Airflow Webserver
  # ============================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"   # Airflow UI (서버는 SSH 터널로 접속)
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # 6. Airflow Scheduler
  # ============================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
      - ./tests:/opt/airflow/tests                  # 테스트 (integration test 실행용)
      - /var/run/docker.sock:/var/run/docker.sock   # DockerOperator용 docker socket
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # 7. dbt (DockerOperator가 이 이미지로 컨테이너를 생성하여 실행)
  # ============================================================
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    image: steam-dbt:latest       # DockerOperator에서 참조할 이미지명
    profiles: ["dbt"]             # docker-compose up 시 자동 시작 안 함 (빌드 전용)
    depends_on:
      analytics-postgres:
        condition: service_healthy

volumes:
  airflow_pg_data:
  analytics_pg_data:
  analytics_pg_replica_data:
  seaweedfs_data:
  kafka_data:
